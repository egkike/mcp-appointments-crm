# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# Release configuration — MCP Appointments CRM (ADR-0014, Decision 1).
#
# Driven by .github/workflows/release.yml on every annotated `vX.Y.Z` tag.
# scripts/install.sh hard-codes the asset names produced here, so the archive
# name template and the inner binary name `mcp-server` are an installer contract:
# keep them in sync with `compose_asset_name()` in scripts/install.sh. Changing
# them silently breaks every `curl | bash` install.
#
# Local dry-run, no GITHUB_TOKEN and no network required:
#   goreleaser check
#   goreleaser release --snapshot --clean --skip=publish

version: 2

project_name: mcp-appointments-crm

builds:
  - id: mcp-server
    main: ./cmd/mcp-server
    # Cross-compilation matrix from docs/PRD.md §3.5: 5 platforms, no C toolchain.
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    # CGO stays off: modernc.org/sqlite is pure Go, so a single builder covers
    # all 5 targets without a cross toolchain (ADR-0014, Decision 1).
    env:
      - CGO_ENABLED=0
    # Unix archives carry the plain `mcp-server` name that install.sh extracts.
    # The Windows zip carries `mcp-server_windows_amd64.exe` (ADR-0014, Decision 1/3);
    # GoReleaser appends the `.exe` suffix for GOOS=windows by itself.
    binary: 'mcp-server{{ if eq .Os "windows" }}_{{ .Os }}_{{ .Arch }}{{ end }}'
    # Only `Version` exists in internal/buildinfo; `-s -w` strips debug info.
    ldflags:
      - -s -w -X github.com/egkike/mcp-appointments-crm/internal/buildinfo.Version={{ .Version }}

archives:
  - id: mcp-appointments-crm
    ids: [mcp-server]
    # The final names are the installer contract (mcp-appointments-crm_Linux_x86_64.tar.gz,
    # mcp-appointments-crm_Darwin_arm64.tar.gz, mcp-appointments-crm_Windows_x86_64.zip).
    # `.Os`/`.Arch` are the raw GOOS/GOARCH values (verified with goreleaser 2.18.2:
    # they render as linux/amd64), so the uname-style spelling install.sh composes
    # from `uname -s`/`uname -m` is mapped explicitly here instead of relying on
    # implicit replacements that this config never enabled.
    name_template: >-
      {{ .ProjectName }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # The binary is always archived; these are the extra files that make an
    # archive self-sufficient for install on all platforms (backup + services).
    files:
      - scripts/backup.sh
      - setup/service/mcp-appointments-crm.service
      - setup/service/com.mcp.appointments.server.plist

# install.sh verifies the downloaded archive against this file, so the name is
# part of the installer contract as well (ADR-0014, Decision 2).
checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Performance improvements
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Refactors
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Others
      order: 999
  filters:
    # Scoped types are the norm in this repo (`docs(odd):`, `chore(ci):`), so the
    # exclusion patterns tolerate an optional scope: those commits never reach
    # the user-facing release notes.
    exclude:
      - '^docs(\([[:word:]]+\))?!?:'
      - '^chore(\([[:word:]]+\))?!?:'

release:
  github:
    owner: egkike
    name: mcp-appointments-crm
  # Drafts would leave the tag without publishable assets; releases go out directly.
  draft: false
