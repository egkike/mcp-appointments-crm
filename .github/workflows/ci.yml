# CI for code changes — MCP Appointments CRM
#
# Verifies Go code on every PR (and on direct pushes to main). The workflow
# itself runs on every push/PR so that a required status check is ALWAYS
# reported; path filtering happens at the JOB level via dorny/paths-filter.
# When no Go code changed, the "ci" job is skipped and GitHub treats a skipped
# required check as approved (an absent check would instead block the push).
# Docs-only changes therefore flow to main directly without friction.
#
# Pipeline mirrors AGENTS.md "Pre-Commit Checklist":
#   go fmt -> go vet -> golangci-lint -> go build -> go test -race -> govulncheck
#
# Name of this job is "ci" (job name "Verify Go code") — registered as the
# required status check in the main-ci-gate branch ruleset.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Go changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            code:
              - '*.go'
              - 'go.mod'
              - 'go.sum'
              - 'internal/**'
              - 'cmd/**'
              - 'pkg/**'
              - 'scripts/**'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'

  ci:
    name: Verify Go code
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          check-latest: true

      - name: Print Go version
        run: go version

      - name: Format check
        run: |
          go fmt ./...
          test -z "$(git diff --name-only)" || { echo "go fmt modified files:"; git diff --name-only; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: ./...

      - name: Build
        run: go build -o /dev/null ./...

      - name: Test (race enabled)
        run: go test -v -race -count=1 ./...

      - name: Dependency vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...