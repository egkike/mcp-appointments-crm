# CI for code changes — MCP Appointments CRM
#
# Verifies Go code on every PR (and on every merge into main). The workflow
# itself runs on every push/PR so that a required status check is ALWAYS
# reported; path filtering happens at the JOB level via dorny/paths-filter.
# When no Go code changed, the "ci" job is skipped and GitHub treats a skipped
# required check as approved (an absent check would instead block the push).
# Docs-only changes still get that check reported (the jobs are skipped, which
# GitHub counts as satisfying the required check) — but they now reach main only
# through a pull request, like every other change.
#
# Pipeline mirrors AGENTS.md "Pre-Commit Checklist":
#   go fmt -> go vet -> golangci-lint -> go build -> go test -race -> govulncheck
#
# Name of this job is "ci" (job name "Verify Go code") — registered as the
# required status check in the main-ci-gate branch ruleset.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Go changes
    runs-on: ubuntu-26.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
      installer: ${{ steps.filter.outputs.installer }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            code:
              - '*.go'
              - 'go.mod'
              - 'go.sum'
              - 'internal/**'
              - 'cmd/**'
              - 'pkg/**'
              - 'scripts/**'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
            # Installer-relevant paths: the file:// fake release the macOS
            # smoke stages carries the built binary plus setup/ contents, and
            # the installer itself is scripts/. Go-only PRs skip the small,
            # starvation-prone macOS runner pool (reproductor-musica doctrine,
            # issue #66 there); darwin COMPILATION stays gated on every Go
            # PR via the cross-builds in the ci job.
            installer:
              - 'scripts/**'
              - 'setup/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yml'

  ci:
    name: Verify Go code
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          check-latest: true

      - name: Print Go version
        run: go version

      - name: Format check
        run: |
          go fmt ./...
          test -z "$(git diff --name-only)" || { echo "go fmt modified files:"; git diff --name-only; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: ./...

      - name: Build
        run: go build -o /dev/null ./...

      # The Linux pipeline only proves linux targets (goos), so a
      # darwin-only compilation break would otherwise surface at release
      # time, after the tag exists. Cross-builds cost seconds on this same
      # runner and gate every Go PR; the release (.goreleaser.yaml) ships
      # darwin/amd64 and darwin/arm64.
      - name: Cross-build darwin amd64
        run: GOOS=darwin GOARCH=amd64 go build -o /dev/null ./...

      - name: Cross-build darwin arm64
        run: GOOS=darwin GOARCH=arm64 go build -o /dev/null ./...

      - name: Test (race enabled)
        run: go test -v -race -count=1 ./...

      - name: Dependency vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  # macOS installer smoke — native launchd path of scripts/install.sh
  # (render_launchd_plist + launchctl bootstrap), which the Linux pipeline can
  # never execute. Scoped by the `installer` filter so the small, starvation-
  # prone macOS runner pool only serves installer-relevant PRs; a SKIPPED
  # instance here is still reported as a satisfying check instance (the same
  # #16 doctrine the ci job follows for docs-only pushes). macos-14 runner
  # images retired on 2026-11-02; macos-15 is the pinned stable successor.
  install-macos:
    name: Install macOS
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          check-latest: true

      # Real-binary e2e on native darwin: build cmd/mcp-server, stage a
      # checksummed fake release, run scripts/install.sh --version over
      # file:// URLs (this IS the live bash 3.2 gate for the whole script and
      # the launchd bootstrap), then prove the agent teardown via bootout and
      # the idempotent second bootout.
      - name: Install smoke (native launchd e2e)
        run: bash scripts/tests/macos_smoke_test.sh

      - name: Print macOS shell hygiene
        if: failure()
        run: |
          echo "bash: $(bash --version | head -1)"
          echo "uname: $(uname -srm)"
